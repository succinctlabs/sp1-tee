name: Deploy a stack
on:
    push:
        tags:
            - "v[0-9]+"
            - "v[0-9]+-staging"

env:
    ECR_REGISTRY: public.ecr.aws
    ECR_REPOSITORY: succinct-labs/sp1-tee-enclave

jobs:
    docker-build-push:
        runs-on:
            [
                "runs-on",
                "runner=32cpu-linux-x64",
                "run-id=${{ github.run_id }}",
                "spot=false",
            ]
        steps:
            - name: Retrieve the tag
              run: |
                  echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
                  echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV

            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: "true"

            - name: Configure AWS credentials
              uses: "aws-actions/configure-aws-credentials@v1"
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Set up Docker
              uses: docker/setup-buildx-action@v3

            - name: Login to Amazon ECR Public
              id: login-ecr-public
              uses: aws-actions/amazon-ecr-login@v2
              with:
                  registry-type: public

            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
                  load: true
                  tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.RELEASE_TAG }}-${{ env.SHORT_SHA }}
                  cache-from: type=gha
                  cache-to: type=gha, mode=max

            - name: Push Docker image to Amazon ECR Public
              run: |
                  docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.RELEASE_TAG }}-${{ env.SHORT_SHA }}
    deploy:
        needs: docker-build-push
        runs-on:
            [
                "runs-on",
                "runner=32cpu-linux-x64",
                "run-id=${{ github.run_id }}",
                "spot=false",
            ]
        steps:
            - name: Retrieve the env variables
              id: env
              run: |
                  set -euo pipefail
                  # Validate the release tag format up front. The push
                  # trigger filter (v[0-9]+ / v[0-9]+-staging) accepts
                  # most well-formed tags, but the snapshot-existence
                  # gate later in this job parses the version number
                  # from the tag with sed and the generator writes
                  # `signers-v{N}.bin` from a u32 constant. Reject
                  # leading-zero forms (`v01`, `v00`) so the tag's
                  # version number is unambiguous and matches the key
                  # the generator produces.
                  if [[ ! "${{ github.ref_name }}" =~ ^v(0|[1-9][0-9]*)(-staging)?$ ]]; then
                      echo "::error::Release tag ${{ github.ref_name }} does not match ^v(0|[1-9][0-9]*)(-staging)?$"
                      echo "::error::(leading zeros rejected: 'v01' would desync from generator's 'signers-v1.bin')"
                      exit 1
                  fi
                  if [[ ${{ github.ref_name }} == *staging* ]]; then
                      echo "environment=staging" >> $GITHUB_OUTPUT
                      echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}" >> $GITHUB_ENV
                      echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}" >> $GITHUB_ENV
                      echo "AWS_REGION=${{ secrets.AWS_REGION_STAGING }}" >> $GITHUB_ENV
                      echo "CERTIFICATE_ARN=${{ secrets.CERTIFICATE_ARN_STAGING }}" >> $GITHUB_ENV
                      echo "HOSTED_ZONE_ID=${{ secrets.HOSTED_ZONE_ID_STAGING }}" >> $GITHUB_ENV
                  else
                      echo "environment=prod" >> $GITHUB_OUTPUT
                      echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                      echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                      echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
                      echo "CERTIFICATE_ARN=${{ secrets.CERTIFICATE_ARN }}" >> $GITHUB_ENV
                      echo "HOSTED_ZONE_ID=${{ secrets.HOSTED_ZONE_ID }}" >> $GITHUB_ENV
                  fi
                  echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
                  echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV

            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure AWS credentials
              uses: "aws-actions/configure-aws-credentials@v1"
              with:
                  aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Install AWS CDK
              run: pnpm install -g aws-cdk

            - name: Deploy Base Stack
              run: |
                  if [ "${{ steps.env.outputs.environment }}" = "staging" ]; then
                    cdk deploy Sp1TeeBaseStack-staging --require-approval never
                  else
                    cdk deploy Sp1TeeBaseStack --require-approval never
                  fi

            # Versioned Stack deploys before Stub Stack so the
            # `sp1-tee-snapshot-generate` binary is installed on the
            # versioned host before the snapshot existence gate runs.
            # The priority-30 `/signers` listener rule was already
            # deployed in a prior phase, so re-deploying Versioned before
            # Stub does not introduce a `/signers` routing gap.
            - name: Deploy Versioned Stack
              run: |
                  cdk deploy Sp1TeeVersionedStack-${{ env.RELEASE_TAG }} --require-approval never

            # Snapshot existence gate. Stub Stack's `/signers` handler reads
            # from `signers-v{N}.bin` in the private snapshots bucket; if the
            # object doesn't exist yet, deploying the new stub binary would
            # cause `/signers` to return 503 until an operator manually runs
            # `sp1-tee-snapshot-generate`.
            #
            # First deploy of the snapshot architecture (or any future
            # `SP1_TEE_VERSION` bump) requires the operator to:
            #   1. Scale Versioned ASG to desired=1 (temporarily)
            #   2. Wait for fresh raw attestations (~5-10 min)
            #   3. SSM-exec `sp1-tee-snapshot-generate` on the host
            #   4. Scale ASG back to desired=0
            #   5. Re-run this failed job in GitHub Actions
            #
            # On subsequent retags the snapshot persists, so this gate is a
            # cheap no-op.
            - name: Verify snapshot object exists before deploying Stub
              run: |
                  set -euo pipefail
                  if [ "${{ steps.env.outputs.environment }}" = "staging" ]; then
                    STACK_NAME="Sp1TeeBaseStack-staging"
                    EXPORT_NAME="Sp1TeeSignersSnapshotsBucketName-staging"
                  else
                    STACK_NAME="Sp1TeeBaseStack"
                    EXPORT_NAME="Sp1TeeSignersSnapshotsBucketName"
                  fi
                  BUCKET=$(aws cloudformation describe-stacks \
                    --stack-name "$STACK_NAME" \
                    --query "Stacks[0].Outputs[?ExportName=='$EXPORT_NAME'].OutputValue" \
                    --output text)
                  if [ -z "$BUCKET" ]; then
                    echo "::error::Could not resolve snapshots bucket name from $STACK_NAME / $EXPORT_NAME"
                    exit 1
                  fi
                  VERSION=$(echo "${{ env.RELEASE_TAG }}" | sed -E 's/^v([0-9]+).*$/\1/')
                  KEY="signers-v${VERSION}.bin"

                  # Use list-objects-v2 instead of head-object: a successful
                  # call returning empty `Contents` cleanly distinguishes
                  # "object missing" from "AWS error" (IAM drift, throttle,
                  # region mismatch) without parsing localized stderr.
                  set +e
                  LIST_OUTPUT=$(aws s3api list-objects-v2 \
                      --bucket "$BUCKET" \
                      --prefix "$KEY" \
                      --max-keys 1 \
                      --output json 2>&1)
                  LIST_STATUS=$?
                  set -e

                  if [ $LIST_STATUS -ne 0 ]; then
                    echo "::error::list-objects-v2 on $BUCKET prefix $KEY failed:"
                    echo "::error::$LIST_OUTPUT"
                    echo "::error::This is NOT the missing-snapshot path — likely IAM"
                    echo "::error::(missing s3:ListBucket on the deploy role), region, or"
                    echo "::error::throttling. Do NOT run snapshot-generate; investigate"
                    echo "::error::the AWS error first."
                    exit 1
                  fi

                  FOUND=$(echo "$LIST_OUTPUT" | jq -r --arg k "$KEY" '.Contents[]?.Key | select(. == $k)')

                  if [ -n "$FOUND" ]; then
                    echo "Snapshot $BUCKET/$KEY found; safe to deploy Stub Stack."
                  else
                    echo "::error::Snapshot $BUCKET/$KEY not found."
                    echo "::error::This is expected on the first deploy of a new SP1_TEE_VERSION."
                    echo "::error::Runbook to recover:"
                    echo "::error::  1) Scale Sp1TeeVersionedStack-${{ env.RELEASE_TAG }} ASG to desired=1"
                    echo "::error::  2) Wait at least one full ATTESTATION_INTERVAL (30 min) after the host"
                    echo "::error::     is up so every signer's raw attestation refreshes — running the"
                    echo "::error::     generator earlier risks --allow-shrink scenarios."
                    echo "::error::  3) SSM-exec the generator on the host with both env vars sourced"
                    echo "::error::     from /etc/sp1-tee (AWS_REGION must be explicit; SSM session env"
                    echo "::error::     does not inherit from systemd):"
                    echo "::error::       sudo -u ec2-user -H \\\\"
                    echo "::error::         SP1_TEE_SNAPSHOTS_BUCKET=\$(cat /etc/sp1-tee/snapshots-bucket) \\\\"
                    echo "::error::         AWS_REGION=\$(cat /etc/sp1-tee/aws-region) \\\\"
                    echo "::error::         ~ec2-user/.cargo/bin/sp1-tee-snapshot-generate"
                    echo "::error::     If the binary exits with 'If-Match precondition failed', another"
                    echo "::error::     writer raced you — re-run the same command (the next read picks"
                    echo "::error::     up the fresh ETag and the second attempt completes cleanly)."
                    echo "::error::STOP: BEFORE clicking Re-run failed jobs, do BOTH of these:"
                    echo "::error::  4a) Scale ASG back to desired=0"
                    echo "::error::  4b) Wait until 'aws autoscaling describe-auto-scaling-groups ... \\\\"
                    echo "::error::      --query AutoScalingGroups[0].Instances' returns [] — terminating"
                    echo "::error::      instances would race with the re-run's cdk deploy on Versioned."
                    echo "::error::  5) Re-run failed jobs in the GitHub Actions UI."
                    exit 1
                  fi

            - name: Deploy Stub Stack
              run: |
                  if [ "${{ steps.env.outputs.environment }}" = "staging" ]; then
                    cdk deploy Sp1TeeStubStack-staging --require-approval never
                  else
                    cdk deploy Sp1TeeStubStack --require-approval never
                  fi
